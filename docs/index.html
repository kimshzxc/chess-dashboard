<html lang="ko">
<head>

<title>lineear 래피드 분석</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2;--surface:#fcfcfb;--line:#e4e2dc;--text:#0b0b0b;--text2:#52514e;--muted:#8a8883;
  --me:#2a78d6;--opp:#eb6834;--me-soft:#cde2fb;
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --win:#0ca30c;--loss:#d03b3b;--draw:#8a8883;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;--bg:#121211;--surface:#1a1a19;--line:#2e2e2b;--text:#fff;--text2:#c3c2b7;--muted:#8a8883;
  --me:#3987e5;--opp:#d95926;--me-soft:#1c3a63;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 0 8px;z-index:2;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--text2);font-size:12px}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;padding:7px 0;border:1px solid var(--line);background:var(--surface);color:var(--text2);border-radius:8px;font-size:13px}
.tabs button.on{background:var(--me);color:#fff;border-color:var(--me);font-weight:600}
main{max-width:720px;margin:0 auto}
section{margin-top:22px}
h2{font-size:15px;margin:0 0 10px;color:var(--text)}
h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--text2)}
.tile .v{font-size:22px;font-weight:600;line-height:1.2;margin-top:2px;white-space:nowrap}
.tile .v.sm{font-size:17px}
.tile .d{font-size:11px;color:var(--muted);margin-top:2px}
.weak{border-left:4px solid var(--muted)}
.weak.critical{border-left-color:var(--critical)}.weak.serious{border-left-color:var(--serious)}
.weak.warning{border-left-color:var(--warning)}.weak.good{border-left-color:var(--good)}
.weak .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.weak .t .ic{font-size:12px;padding:1px 6px;border-radius:6px;color:#fff;background:var(--muted)}
.critical .ic{background:var(--critical)}.serious .ic{background:var(--serious)}.warning .ic{background:var(--warning);color:#000}.good .ic{background:var(--good)}
.weak p{margin:4px 0 0;font-size:13px;color:var(--text2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px}
.bars .lbl{color:var(--text2);white-space:nowrap}
.bar{height:10px;border-radius:0 4px 4px 0;background:var(--me);position:relative}
.bar.opp{background:var(--opp)}
.bar span{position:absolute;left:calc(100% + 6px);top:-3px;font-size:11px;color:var(--text2);white-space:nowrap}
.pair{display:flex;flex-direction:column;gap:2px;padding:1px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text2);font-weight:500;font-size:11px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.game{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.game:last-child{border-bottom:0}
.res{width:34px;height:34px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.res.W{background:var(--win)}.res.L{background:var(--loss)}.res.D{background:var(--draw)}
.game .m{flex:1;min-width:0}
.game .m .h{display:flex;justify-content:space-between;gap:8px}
.game .m .h b{font-weight:600}
.game .m .s{color:var(--text2);font-size:12px}
.game .m .w{font-size:12px;margin-top:2px}
a{color:var(--me);text-decoration:none}
.mono{font-family:ui-monospace,Menlo,monospace}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
footer{margin-top:28px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>

let W = 'all';
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clk = (s)=> s==null?'-':`${Math.floor(Math.round(s)/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;
const ev = (cp)=> Math.abs(cp)>=9000 ? (cp>0?'#승':'#패') : (cp/100).toFixed(1).replace(/^(-?)/,(m,s)=>s||'+');
const mv = (w)=> `${w.move}.${w.mover==='w'?'':'..'}${w.san}`;
const pct=(v)=> v==null?'-':v+'%';

function bars(rows, max, opts={}){
  // rows: [{label, me, opp?, fmt}] — 가로 막대, 나(파랑)/상대(주황)
  let h='<div class="bars">';
  for(const r of rows){
    const fmt=r.fmt||((x)=>x);
    if(r.opp!==undefined){
      h+=`<div class="lbl">${esc(r.label)}</div><div class="pair">
        <div class="bar" style="width:${Math.max(2,r.me/max*100*0.78)}%"><span>${fmt(r.me)}</span></div>
        <div class="bar opp" style="width:${Math.max(2,r.opp/max*100*0.78)}%"><span>${fmt(r.opp)}</span></div></div>`;
    } else {
      h+=`<div class="lbl">${esc(r.label)}</div><div><div class="bar${r.cls||''}" style="width:${Math.max(2,r.me/max*100*0.78)}%"><span>${fmt(r.me)}${r.note?` <span style="position:static;color:var(--muted)">${esc(r.note)}</span>`:''}</span></div></div>`;
    }
  }
  return h+'</div>';
}
const legend = ()=>`<div class="legend"><span><i style="background:var(--me)"></i>나</span><span><i style="background:var(--opp)"></i>상대</span></div>`;

function render(){
  const S = DATA.windows[W];
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.w===W));
  $('#title').textContent = `${DATA.username} · 래피드 분석`;
  $('#foot').textContent = `마지막 갱신 ${DATA.generated} (KST) · Stockfish 19 depth 14 · 10분마다 자동 갱신`;
  if(!S){ $('#subtitle').textContent=''; $('#main').innerHTML='<div class="empty">이 기간에 분석된 래피드 게임이 없습니다.</div>'; return; }
  const o=S.overview, t=S.time, c=S.conversion, tc=S.tactics;
  $('#subtitle').textContent = `${o.first_date} ~ ${o.last_date} · ${o.games}판 · 레이팅 ${o.rating} (최고 ${o.rating_best})`;
  let h='';

  // 보완점
  h+=`<section><h2>보완점<small>통계에서 자동 추출</small></h2>`;
  if(!S.weaknesses.length) h+='<div class="empty">두드러진 약점이 없습니다.</div>';
  for(const w of S.weaknesses){
    const ic={critical:'중요',serious:'주의',warning:'참고',good:'강점'}[w.level]||'';
    h+=`<div class="card weak ${w.level}"><div class="t"><span class="ic">${ic}</span>${esc(w.title)}</div><p>${esc(w.text)}</p></div>`;
  }
  h+='</section>';

  // 요약
  h+=`<section><h2>요약</h2><div class="tiles">
    <div class="tile"><div class="k">전적</div><div class="v sm">${o.win}승 ${o.draw}무 ${o.loss}패</div><div class="d">승률 ${o.score}% · 백 ${pct(o.score_w)} / 흑 ${pct(o.score_b)}</div></div>
    <div class="tile"><div class="k">정확도</div><div class="v">${o.accuracy}%</div><div class="d">상대 ${o.opp_accuracy}%</div></div>
    <div class="tile"><div class="k">대실수 / 판</div><div class="v">${o.blunders_pg}</div><div class="d">상대 ${o.opp_blunders_pg}</div></div>
    <div class="tile"><div class="k">레이팅 변화</div><div class="v">${o.rating-o.rating_start>=0?'+':''}${o.rating-o.rating_start}</div><div class="d">${o.rating_start} → ${o.rating}</div></div>
  </div></section>`;

  // 시간 관리
  h+=`<section><h2>시간 관리</h2><div class="card">${legend()}<div class="sub" style="margin-bottom:6px">N수 시점 남은 시간 (중앙값)</div>`;
  h+=bars(t.clock_at.filter(r=>r.me!=null&&r.opp!=null).map(r=>({label:`${r.move}수`,me:r.me,opp:r.opp,fmt:clk})),600);
  h+=`</div><div class="tiles">
    <div class="tile"><div class="k">시간패</div><div class="v">${t.timeouts}</div><div class="d">이기던 판 ${t.timeouts_winning} · 상대 시간패 ${t.opp_timeouts}</div></div>
    <div class="tile"><div class="k">20수에 시간 뒤진 판 승률</div><div class="v">${pct(t.behind_at_20.score)}</div><div class="d">${t.behind_at_20.n}판 · 앞선 판 ${pct(t.ahead_at_20.score)} (${t.ahead_at_20.n}판)</div></div>
    <div class="tile"><div class="k">오프닝 장고 (1~10수, 45초+)</div><div class="v">${t.long_thinks_opening}</div><div class="d">전체 장고 ${t.long_thinks_total}회</div></div>
    <div class="tile"><div class="k">30초 미만으로 끝난 판</div><div class="v">${t.low_clock_games.n}</div><div class="d">그중 패배 ${t.low_clock_games.losses}</div></div>
  </div>`;
  const bc=t.blunder_by_clock, bs=t.blunder_by_spent;
  const mx=Math.max(...bc.map(b=>b.rate),...bs.map(b=>b.rate),1);
  h+=`<div class="card"><div class="sub" style="margin-bottom:6px">남은 시간별 대실수율</div>${bars(bc.map(b=>({label:b.label,me:b.rate,fmt:pct,note:`(${b.moves}수)`})),mx)}</div>`;
  h+=`<div class="card"><div class="sub" style="margin-bottom:6px">한 수에 쓴 시간별 대실수율</div>${bars(bs.map(b=>({label:b.label,me:b.rate,fmt:pct,note:`(${b.moves}수, 정확도 ${b.accuracy}%)`})),mx)}</div></section>`;

  // 국면
  h+=`<section><h2>국면별</h2><div class="card"><table><tr><th>국면</th><th class="n">수</th><th class="n">정확도</th><th class="n">상대</th><th class="n">대실수율</th></tr>`;
  for(const p of S.phase) h+=`<tr><td>${p.label}</td><td class="n">${p.moves}</td><td class="n">${p.accuracy}%</td><td class="n">${p.opp_accuracy}%</td><td class="n">${p.blunder_rate}%</td></tr>`;
  h+=`</table></div>`;
  if(S.blunder_by_move.length){
    h+=`<div class="card"><div class="sub" style="margin-bottom:6px">수 구간별 대실수율</div>${bars(S.blunder_by_move.map(b=>({label:b.label+'수',me:b.rate,fmt:pct})),Math.max(...S.blunder_by_move.map(b=>b.rate),1))}</div>`;
  }
  h+='</section>';

  // 마무리/역전
  const cw=c.winning, cl=c.losing;
  h+=`<section><h2>마무리와 역전</h2><div class="tiles">
    <div class="tile"><div class="k">+3 이상 유리했던 판</div><div class="v">${cw.n?Math.round(cw.won/cw.n*100):0}% 승</div><div class="d">${cw.n}판 중 ${cw.won}승 ${cw.draw}무 <b style="color:var(--loss)">${cw.lost}패</b></div></div>
    <div class="tile"><div class="k">-3 이하 불리했던 판</div><div class="v">${cl.n?Math.round(cl.won/cl.n*100):0}% 역전</div><div class="d">${cl.n}판 중 ${cl.won}승 ${cl.draw}무 ${cl.lost}패</div></div>
  </div></section>`;

  // 전술
  const hungRows=Object.entries(tc.hung).sort((a,b)=>b[1]-a[1]);
  h+=`<section><h2>전술</h2><div class="tiles">
    <div class="tile"><div class="k">기물 방치 (한 수에 잡히는 기물)</div><div class="v">${tc.hung_total}</div><div class="d">판당 ${tc.hung_pg} · ${hungRows.map(([k,v])=>`${k} ${v}`).join(' · ')||'-'}<br>시간 1분 이상 남았을 때 ${tc.hung_with_time}회</div></div>
    <div class="tile"><div class="k">공짜 기물 안 잡음</div><div class="v">${tc.missed_free}</div><div class="d">잡는 수가 최선(+2 이상)인데 다른 수</div></div>
    <div class="tile"><div class="k">외통 놓침</div><div class="v">${tc.missed_mate_total}</div><div class="d">${Object.entries(tc.missed_mate).map(([k,v])=>`${k}${k==='5'?'+':''}수 외통 ${v}`).join(' · ')||'-'}</div></div>
  </div></section>`;

  // 오프닝
  h+=`<section><h2>오프닝<small>3판 이상 둔 첫 4수</small></h2>`;
  for(const [col,name] of [['w','백'],['b','흑']]){
    const rows=S.openings[col]||[];
    h+=`<div class="card"><div class="sub" style="margin-bottom:4px"><b>${name}</b></div>`;
    if(!rows.length){h+='<div class="empty">데이터 부족</div></div>';continue;}
    h+=`<div class="tw"><table><tr><th>수순</th><th class="n">판</th><th class="n">승률</th><th class="n">전적</th><th class="n">15수 내<br>대실수</th></tr>`;
    for(const r of rows) h+=`<tr><td><span class="mono">${esc(r.moves)}</span><br><span class="sub">${esc(r.name)}</span></td><td class="n">${r.n}</td><td class="n" style="color:${r.score<45?'var(--loss)':r.score>=60?'var(--win)':'inherit'}">${r.score}%</td><td class="n">${r.win}/${r.draw}/${r.loss}</td><td class="n">${r.early_blunders}</td></tr>`;
    h+='</table></div></div>';
  }
  h+='</section>';

  // 월별
  if(S.monthly.length>1){
    h+=`<section><h2>월별 추이</h2><div class="card"><table><tr><th>월</th><th class="n">판</th><th class="n">승률</th><th class="n">정확도</th><th class="n">대실수/판</th><th class="n">레이팅</th></tr>`;
    for(const m of S.monthly) h+=`<tr><td>${m.month}</td><td class="n">${m.games}</td><td class="n">${m.score}%</td><td class="n">${m.accuracy}%</td><td class="n">${m.blunders_pg}</td><td class="n">${m.rating}</td></tr>`;
    h+='</table></div></section>';
  }

  // 최근 게임
  h+=`<section><h2>최근 게임<small>새 게임 순</small></h2><div class="card">`;
  for(const g of S.recent){
    const how={checkmated:'메이트',resigned:'기권',timeout:'시간',abandoned:'포기',agreed:'합의',repetition:'반복',stalemate:'스테일',insufficient:'기물부족'};
    const endby=g.outcome==='W'?how[g.opp_result]:g.outcome==='L'?how[g.my_result]:how[g.my_result];
    const w=g.worst;
    h+=`<div class="game"><div class="res ${g.outcome}">${g.outcome==='W'?'승':g.outcome==='L'?'패':'무'}</div><div class="m">
      <div class="h"><b>${g.color==='w'?'백':'흑'} vs ${esc(g.opp)} (${g.opp_elo})</b><span class="s">${g.date}</span></div>
      <div class="s">${endby||''} · 정확도 ${g.accuracy}% · 대실수 ${g.blunders} 실수 ${g.mistakes}${g.hung?` · 방치 ${g.hung}`:''}${g.missed_mate?` · 외통놓침 ${g.missed_mate}`:''} · 종료시 시계 ${clk(g.my_final_clock)} / ${clk(g.opp_final_clock)}</div>
      ${w&&w.wp_loss>=10?`<div class="w">결정적 실수 <span class="mono">${mv(w)}</span> → 정답 <span class="mono">${esc(w.best)}</span> (${ev(w.cp_before)} → ${ev(w.cp_after)}, 남은시간 ${clk(w.clock)})</div>`:''}
      <div class="s"><a href="${esc(g.url)}" target="_blank" rel="noopener">체스닷컴에서 보기 ↗</a> · ${esc(g.eco_name)}</div>
    </div></div>`;
  }
  h+='</div></section>';

  // 최악의 실수
  h+=`<section><h2>가장 큰 실수<small>승률 30%p 이상 손해</small></h2><div class="card">`;
  if(!S.worst.length) h+='<div class="empty">없음</div>';
  for(const w of S.worst){
    h+=`<div class="game"><div class="m">
      <div class="h"><b><span class="mono">${mv(w)}</span> 대신 <span class="mono">${esc(w.best)}</span></b><span class="s">${w.date}</span></div>
      <div class="s">${ev(w.cp_before)} → ${ev(w.cp_after)} (−${w.wp_loss}%p) · vs ${esc(w.opp)} · ${ {opening:'오프닝',middlegame:'중반',endgame:'엔드게임'}[w.phase]} · 남은시간 ${clk(w.clock)} · 이 수에 ${w.spent==null?'-':Math.round(w.spent)+'초'}</div>
      <div class="s"><a href="${esc(w.url)}" target="_blank" rel="noopener">체스닷컴에서 ${w.move}수 보기 ↗</a></div>
    </div></div>`;
  }
  h+='</div></section>';
  $('#main').innerHTML=h;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{W=b.dataset.w;try{localStorage.setItem('chess-window',W)}catch(e){};render();window.scrollTo(0,0)}));
try{const s=localStorage.getItem('chess-window'); if(s&&DATA.windows[s]) W=s;}catch(e){}
render();
</script>
</body>
</html>
