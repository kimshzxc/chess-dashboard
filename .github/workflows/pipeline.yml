# 체스닷컴 게임 감시 → 스톡피시 분석 → 대시보드 생성 → ntfy 알림 → docs/ 와 data/chess.db 커밋
#
# 한 번 실행되면 약 5시간 45분 동안 1분마다 새 게임을 확인하고, 끝나기 전에 다음 실행을 스스로 예약한다.
# 30분 간격 스케줄은 체인이 끊겼을 때 다시 시작하는 안전망이다 (실행 중이면 대기열에만 쌓이고 겹치지 않는다).
name: chess pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      render_only:
        description: "새 게임 수집 없이 대시보드만 다시 생성 (진행 중인 감시가 끝난 뒤 실행됨)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: chess-pipeline
  cancel-in-progress: false

env:
  STOCKFISH_TAG: sf_19
  WATCH_MINUTES: 345

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          sudo apt-get install -y -qq libcairo2 >/dev/null 2>&1 || true   # 알림 보드 이미지(cairosvg)용
          pip install -r requirements.txt

      - name: 스모크 테스트
        run: python -m unittest discover -s tests

      - name: Stockfish 캐시
        id: sf
        uses: actions/cache@v4
        with:
          path: engine
          key: stockfish-${{ env.STOCKFISH_TAG }}-linux-x86-64-v2

      - name: Stockfish 내려받기
        if: steps.sf.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf engine /tmp/sf && mkdir -p engine /tmp/sf
          curl -fsSL -o /tmp/sf/sf.tgz "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_TAG}/stockfish-linux-x86-64-universal.tar.gz"
          tar xzf /tmp/sf/sf.tgz -C /tmp/sf
          bin=$(find /tmp/sf -type f -name 'stockfish-*' ! -name '*.tgz' | head -1)
          test -n "$bin"
          mv "$bin" engine/stockfish && chmod +x engine/stockfish
          test -f engine/stockfish

      - name: Stockfish 동작 확인
        run: (echo uci; echo quit) | ./engine/stockfish | grep -m1 '^id name'

      - name: 감시 루프
        env:
          CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          STOCKFISH_PATH: ${{ github.workspace }}/engine/stockfish
          RENDER_ONLY: ${{ inputs.render_only }}
        run: |
          set -uo pipefail
          git config user.name "chess-pipeline"
          git config user.email "actions@users.noreply.github.com"
          commit_if_changed() {
            git add data/chess.db docs
            git diff --cached --quiet && return 0
            git commit -q -m "update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull -q --rebase origin main && git push -q origin HEAD:main && echo "커밋·푸시 완료" || echo "푸시 실패 (다음 반복에서 재시도)"
          }
          if [ "$RENDER_ONLY" = "true" ]; then
            python pipeline.py --no-push --render-only
            commit_if_changed
            exit 0
          fi
          end=$(( SECONDS + WATCH_MINUTES * 60 )); i=0; fails=0
          echo "감시 시작: ${WATCH_MINUTES}분 동안 1분마다 확인 (10분마다 전체 확인, 5분마다 코드 갱신)"
          while [ $SECONDS -lt $end ]; do
            i=$((i + 1))
            flag="--quick"; [ $((i % 10)) -eq 1 ] && flag=""
            if python pipeline.py --no-push $flag; then fails=0; else
              fails=$((fails + 1)); echo "파이프라인 오류 ${fails}회 연속 (계속 진행)"
              if [ $fails -eq 5 ]; then curl -s -o /dev/null -H "Title: chess pipeline 오류" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -d "파이프라인이 5회 연속 실패했습니다. Actions 로그를 확인하세요." "https://ntfy.sh/$NTFY_TOPIC" || true; fi
            fi
            commit_if_changed
            if [ $((i % 5)) -eq 0 ]; then git pull -q --rebase origin main || true; fi
            sleep 60
          done
          echo "감시 종료"

      - name: 다음 실행 예약
        if: success() && inputs.render_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --ref main

      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # 직전 실행도 실패였으면 (30분마다 재시도되므로) 알림을 반복하지 않는다
          prev=$(gh run list --workflow pipeline.yml --limit 2 --json conclusion -q '.[1].conclusion' 2>/dev/null || echo "")
          if [ "$prev" = "failure" ]; then echo "직전 실행도 실패, 알림 생략"; exit 0; fi
          curl -s -o /dev/null -H "Title: chess pipeline 실패" -H "Tags: rotating_light" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "GitHub Actions 실행이 실패했습니다. 30분 뒤 자동 재시도합니다. 눌러서 로그 확인." "https://ntfy.sh/$NTFY_TOPIC" || true
