# 체스닷컴 게임 감시 → 스톡피시 분석 → 통계 생성 → docs/ 와 data/chess.db 커밋 → 페이지 배포 확인 후 ntfy 알림
#
# 한 번 실행되면 약 5시간 45분 동안 1분마다 새 게임을 확인하고, 끝나기 전에 다음 실행을 스스로 예약한다.
# 실행이 끊겼을 때 다시 띄우는 일은 watchdog.yml 이 맡는다 (이 워크플로에는 스케줄이 없다).
name: chess pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 감시 실행은 한 번에 하나만
concurrency:
  group: chess-pipeline
  cancel-in-progress: false

env:
  STOCKFISH_TAG: sf_19
  WATCH_MINUTES: 345

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          sudo apt-get install -y -qq libcairo2 >/dev/null 2>&1 || true   # 알림 보드 이미지(cairosvg)용
          pip install -r requirements.txt

      - name: 스모크 테스트
        run: python -m unittest discover -s tests

      - name: Stockfish 캐시
        id: sf
        uses: actions/cache@v4
        with:
          path: engine
          key: stockfish-${{ env.STOCKFISH_TAG }}-linux-x86-64-v2

      - name: Stockfish 내려받기
        if: steps.sf.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf engine /tmp/sf && mkdir -p engine /tmp/sf
          curl -fsSL -o /tmp/sf/sf.tgz "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_TAG}/stockfish-linux-x86-64-universal.tar.gz"
          tar xzf /tmp/sf/sf.tgz -C /tmp/sf
          bin=$(find /tmp/sf -type f -name 'stockfish-*' ! -name '*.tgz' | head -1)
          test -n "$bin"
          mv "$bin" engine/stockfish && chmod +x engine/stockfish
          test -f engine/stockfish

      - name: Stockfish 동작 확인
        run: (echo uci; echo quit) | ./engine/stockfish | grep -m1 '^id name'

      - name: 감시 루프
        env:
          CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          STOCKFISH_PATH: ${{ github.workspace }}/engine/stockfish
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          git config user.name "chess-pipeline"
          git config user.email "actions@users.noreply.github.com"
          need_push=0
          # 바뀐 데이터를 커밋하고 올린다. 올릴 것이 없거나 올리기에 성공하면 0.
          # 푸시가 실패하면 need_push 가 남아 다음 반복에서 다시 시도한다 (새 변경이 없어도).
          # 생성 파일이 원격과 충돌하면 이 러너의 것을 택한다 (-X theirs: 리베이스에서는 다시 얹는 내 커밋 쪽).
          sync() {
            git add data/chess.db docs
            if ! git diff --cached --quiet; then
              git commit -q -m "update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
              need_push=1
            fi
            [ "$need_push" -eq 0 ] && return 0
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then
              need_push=0; echo "커밋·푸시 완료"; return 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            echo "푸시 실패 (다음 반복에서 재시도)"; return 1
          }
          end=$(( SECONDS + WATCH_MINUTES * 60 )); i=0; fails=0
          echo "감시 시작: ${WATCH_MINUTES}분 동안 1분마다 확인 (10분마다 전체 확인, 5분마다 코드 갱신)"
          while [ $SECONDS -lt $end ]; do
            i=$((i + 1))
            flag="--quick"; [ $((i % 10)) -eq 1 ] && flag=""
            # 알림은 바로 보내지 않고 쌓아 두었다가, 푸시와 페이지 배포가 끝난 뒤에 보낸다
            if python pipeline.py --defer-notify $flag; then fails=0; else
              fails=$((fails + 1)); echo "파이프라인 오류 ${fails}회 연속 (계속 진행)"
              if [ $fails -eq 5 ]; then curl -s -o /dev/null -H "Title: chess pipeline 오류" -H "Tags: warning" -H "Click: $RUN_URL" -d "파이프라인이 5회 연속 실패했습니다. Actions 로그를 확인하세요." "https://ntfy.sh/$NTFY_TOPIC" || true; fi
            fi
            if sync; then python pipeline.py --send-queued || true; fi
            if [ $((i % 5)) -eq 0 ] && [ "$need_push" -eq 0 ]; then git pull -q --rebase origin main || git rebase --abort >/dev/null 2>&1 || true; fi
            sleep 60
          done
          sync && python pipeline.py --send-queued || true
          echo "감시 종료"

      - name: 다음 실행 예약
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --ref main

      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # 직전 실행도 실패였으면 (watchdog 이 30분마다 다시 띄우므로) 알림을 반복하지 않는다
          prev=$(gh run list --workflow pipeline.yml --limit 2 --json conclusion -q '.[1].conclusion' 2>/dev/null || echo "")
          if [ "$prev" = "failure" ]; then echo "직전 실행도 실패, 알림 생략"; exit 0; fi
          curl -s -o /dev/null -H "Title: chess pipeline 실패" -H "Tags: rotating_light" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "GitHub Actions 실행이 실패했습니다. 30분 안에 자동으로 다시 시작합니다. 눌러서 로그 확인." "https://ntfy.sh/$NTFY_TOPIC" || true
