# 감시 실행(chess pipeline)이 살아 있는지 30분마다 확인하고, 없으면 새로 띄운다.
# 감시 워크플로에 직접 스케줄을 걸면 대기 중인 실행이 하나만 허용되어 예약 실행끼리 서로 취소하므로 분리했다.
name: chess watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 감시 실행 확인
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow pipeline.yml --limit 20 --json status \
            -q '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$active" -gt 0 ]; then
            echo "감시 실행이 살아 있습니다 ($active개)"
          else
            echo "감시 실행이 없어 새로 시작합니다"
            gh workflow run pipeline.yml --ref main
          fi
